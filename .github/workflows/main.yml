name: Build and Deploy
# Every branch and pull request is tested and built; only master is deployed.
# Pushes from other branches (and Dependabot, whose runs get a read-only token)
# must never publish to gh-pages.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      - name: Install and test 🧪
        run: |
          yarn install
          yarn run test

      - name: Build 🔧
        run: yarn run build

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
